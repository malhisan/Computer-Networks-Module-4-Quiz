<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CN Module 4 Quiz</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  :root{--bg:#0d0f14;--surface:#161920;--surface2:#1e2130;--border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.13);--accent:#f9a94b;--accent-soft:rgba(249,169,75,0.12);--success:#34d48a;--success-soft:rgba(52,212,138,0.1);--danger:#f76f6f;--danger-soft:rgba(247,111,111,0.1);--text:#e8eaf0;--text-muted:#7a7f94;--text-dim:#4a5068;--mono:'Space Mono',monospace;--sans:'Sora',sans-serif;}
  body{background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:2rem 1rem 4rem;}
  body::before{content:'';position:fixed;top:-200px;left:50%;transform:translateX(-50%);width:600px;height:400px;background:radial-gradient(ellipse,rgba(249,169,75,0.07) 0%,transparent 70%);pointer-events:none;z-index:0;}
  .header{text-align:center;margin-bottom:2.5rem;position:relative;z-index:1;}
  .tag{display:inline-block;font-family:var(--mono);font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:var(--accent);background:var(--accent-soft);border:1px solid rgba(249,169,75,0.2);padding:4px 12px;border-radius:99px;margin-bottom:1rem;}
  h1{font-size:clamp(22px,4vw,32px);font-weight:600;letter-spacing:-0.03em;color:#fff;line-height:1.2;margin-bottom:0.5rem;}
  .subtitle{font-size:14px;color:var(--text-muted);font-weight:300;}
  .quiz-wrap{width:100%;max-width:660px;position:relative;z-index:1;}
  .progress-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .progress-label{font-family:var(--mono);font-size:11px;color:var(--text-muted);}
  .progress-track{width:100%;height:3px;background:var(--surface2);border-radius:99px;margin-bottom:1.75rem;overflow:hidden;}
  .progress-fill{height:100%;background:linear-gradient(90deg,#f9a94b, #fcd28a);border-radius:99px;transition:width 0.5s cubic-bezier(0.4,0,0.2,1);}
  .q-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:1.75rem;margin-bottom:1rem;animation:fadeUp 0.3s ease;}
  @keyframes fadeUp{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}
  .section-badge{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10px;letter-spacing:0.08em;color:var(--text-dim);margin-bottom:14px;}
  .section-badge::before{content:'';display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);opacity:0.5;}
  .q-text{font-size:16px;font-weight:500;line-height:1.6;color:#fff;margin-bottom:1.25rem;}
  .options{display:flex;flex-direction:column;gap:8px;}
  .opt{display:flex;align-items:center;gap:12px;background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:12px 16px;cursor:pointer;font-size:14px;color:var(--text);font-family:var(--sans);text-align:left;transition:all 0.15s ease;}
  .opt:hover:not(:disabled){background:#252a3a;border-color:var(--border2);}
  .opt:disabled{cursor:default;}
  .opt.correct{background:var(--success-soft);border-color:rgba(52,212,138,0.3);color:var(--success);}
  .opt.wrong{background:var(--danger-soft);border-color:rgba(247,111,111,0.3);color:var(--danger);}
  .opt.revealed{background:rgba(52,212,138,0.06);border-color:rgba(52,212,138,0.2);color:rgba(52,212,138,0.6);}
  .opt-letter{font-family:var(--mono);font-size:11px;font-weight:700;min-width:26px;height:26px;border-radius:8px;background:rgba(255,255,255,0.04);border:1px solid var(--border2);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .feedback{margin-top:14px;padding:12px 16px;border-radius:10px;font-size:13px;line-height:1.6;display:none;}
  .feedback.show{display:block;animation:fadeUp 0.2s ease;}
  .feedback.correct{background:var(--success-soft);color:var(--success);border:1px solid rgba(52,212,138,0.15);}
  .feedback.wrong{background:var(--danger-soft);color:var(--danger);border:1px solid rgba(247,111,111,0.15);}
  .next-btn{display:flex;align-items:center;gap:8px;margin-top:1rem;padding:11px 22px;background:var(--accent-soft);border:1px solid rgba(249,169,75,0.25);border-radius:10px;color:var(--accent);font-family:var(--sans);font-size:14px;font-weight:500;cursor:pointer;transition:all 0.15s;}
  .next-btn:hover{background:rgba(249,169,75,0.2);}
  .next-btn .arrow{transition:transform 0.15s;}
  .next-btn:hover .arrow{transform:translateX(3px);}
  .results{text-align:center;padding:3rem 1.5rem;background:var(--surface);border:1px solid var(--border);border-radius:16px;animation:fadeUp 0.4s ease;}
  .score-ring{width:120px;height:120px;margin:0 auto 1.5rem;position:relative;}
  .score-ring svg{transform:rotate(-90deg);}
  .score-center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;}
  .score-pct{font-family:var(--mono);font-size:26px;font-weight:700;color:#fff;}
  .score-sub{font-size:10px;color:var(--text-muted);margin-top:2px;}
  .result-title{font-size:20px;font-weight:600;color:#fff;margin-bottom:8px;}
  .result-msg{font-size:14px;color:var(--text-muted);line-height:1.6;max-width:360px;margin:0 auto 1.75rem;}
  .stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:1.75rem;}
  .stat{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:14px;}
  .stat-n{font-family:var(--mono);font-size:22px;font-weight:700;margin-bottom:4px;}
  .stat-n.green{color:var(--success);} .stat-n.red{color:var(--danger);} .stat-n.acc{color:var(--accent);}
  .stat-l{font-size:11px;color:var(--text-muted);}
  .restart-btn{padding:12px 28px;background:transparent;border:1px solid var(--border2);border-radius:10px;color:var(--text);font-family:var(--sans);font-size:14px;cursor:pointer;transition:all 0.15s;}
  .restart-btn:hover{background:var(--surface2);}
</style>
</head>
<body>
<div class="header">
  <div class="tag">Ch. 7 · DS360 · SEU</div>
  <h1>CN Module 4 Quiz</h1>
  <p class="subtitle">Transmission Media and Cabling</p>
</div>
<div class="quiz-wrap">
  <div class="progress-row">
    <span class="progress-label" id="prog-label">1 of 30</span>
    <span class="progress-label" id="score-live">Score: 0</span>
  </div>
  <div class="progress-track"><div class="progress-fill" id="prog-fill" style="width:0%"></div></div>
  <div id="quiz-body"></div>
</div>
<script>
const questions=[{"section": "Introduction", "q": "Where do transmission media sit in relation to the physical layer?", "opts": ["Above the physical layer", "At the same level as the physical layer", "Below the physical layer — they are controlled by the physical layer and said to belong to 'layer zero'", "At the data-link layer"], "ans": 2, "exp": "Transmission media are actually located below the physical layer and are directly controlled by the physical layer. We could say that transmission media belong to layer zero."}, {"section": "Introduction", "q": "What are the two broad categories of transmission media?", "opts": ["Digital and Analog", "Wired and Wireless", "Guided and Unguided", "Fast and Slow"], "ans": 2, "exp": "Transmission media can be classified into two broad categories: guided media (which use a physical conductor to direct signals) and unguided media (wireless, which transmit through free space)."}, {"section": "Introduction", "q": "In what form are signals propagated through transmission media?", "opts": ["As acoustic waves", "As electromagnetic energy", "As mechanical vibrations", "As heat energy"], "ans": 1, "exp": "Signals are transmitted from one device to another in the form of electromagnetic energy, which is propagated through transmission media."}, {"section": "Guided Media", "q": "Which of the following is NOT a type of guided media?", "opts": ["Twisted-pair cable", "Coaxial cable", "Fiber-optic cable", "Radio waves"], "ans": 3, "exp": "Guided media include twisted-pair cable, coaxial cable, and fiber-optic cable. Radio waves are unguided (wireless) media."}, {"section": "Guided Media", "q": "What types of conductors do twisted-pair and coaxial cables use?", "opts": ["Glass conductors", "Metallic (copper) conductors that transport signals as electric current", "Optical fibers", "Ceramic conductors"], "ans": 1, "exp": "Twisted-pair and coaxial cable use metallic (copper) conductors that accept and transport signals in the form of electric current."}, {"section": "Twisted-Pair", "q": "How does a twisted-pair cable work to reduce interference?", "opts": ["By using metallic shielding around all wires together", "One wire carries the signal; the other is the ground reference. The receiver uses the difference between the two, which cancels out interference affecting both wires equally", "By using optical fiber inside the copper shell", "By transmitting on multiple frequencies simultaneously"], "ans": 1, "exp": "One of the wires carries signals to the receiver, and the other is used as a ground reference. The receiver uses the difference between the two. Interference (noise) and crosstalk may affect both wires, but by using the difference, the noise is cancelled out."}, {"section": "Twisted-Pair", "q": "What is the key difference between UTP and STP cables?", "opts": ["UTP is faster; STP is slower", "STP has a metal foil or braided-mesh covering around each pair to prevent noise penetration; UTP does not — but UTP is smaller and cheaper", "UTP has more twists per meter than STP", "STP is used for wireless connections; UTP for wired"], "ans": 1, "exp": "STP (Shielded Twisted-Pair) cable has a metal foil or braided-mesh covering that encases each pair of insulated conductors, preventing the penetration of noise or crosstalk. It is bigger and more expensive than UTP."}, {"section": "Twisted-Pair", "q": "What is the most common UTP connector?", "opts": ["BNC connector", "RJ45 (Registered Jack 45)", "SC connector", "ST connector"], "ans": 1, "exp": "The most common UTP connector is RJ45 (RJ stands for registered jack). It is the standard connector for Ethernet cables."}, {"section": "Twisted-Pair", "q": "What is 'gauge' as applied to twisted-pair cable?", "opts": ["The number of twists per meter", "The electrical resistance of the cable", "A measure of the thickness (diameter) of the wire", "The frequency range the cable supports"], "ans": 2, "exp": "Gauge is a measure of the thickness of the wire. It is relevant when measuring attenuation performance of twisted-pair cable — thicker wire generally has lower attenuation."}, {"section": "Twisted-Pair", "q": "What happens to attenuation in twisted-pair cable at higher frequencies?", "opts": ["Attenuation decreases as frequency increases", "Attenuation remains constant regardless of frequency", "Attenuation sharply increases with frequencies above 100 kHz", "Attenuation only increases above 1 GHz"], "ans": 2, "exp": "When measuring performance of twisted-pair cable, attenuation (measured in dB/km) sharply increases with frequencies above 100 kHz."}, {"section": "Coaxial Cable", "q": "Describe the structure of a coaxial cable from the inside out.", "opts": ["Two twisted copper wires → insulation → outer jacket", "Central conductor (copper) → insulating sheath → outer conductor (metal foil/braid) → plastic jacket", "Glass core → cladding → plastic coating → outer jacket", "Single wire → air gap → metal tube → plastic jacket"], "ans": 1, "exp": "Coaxial cable has a central core conductor of solid or stranded wire (usually copper) enclosed in an insulating sheath, which is then encased in an outer conductor of metal foil, braid, or a combination. The outer metallic wrapping serves as both a shield against noise and the second conductor."}, {"section": "Coaxial Cable", "q": "How are coaxial cables categorized, and what does each category denote?", "opts": ["By color code — each color represents a speed rating", "By Radio Government (RG) ratings — each RG number denotes unique physical specifications including impedance, thickness, and usage", "By manufacturer — each brand has its own rating system", "By length — categories are defined by standard cable lengths"], "ans": 1, "exp": "Coaxial cables are categorized by their Radio Government (RG) ratings. Each RG number denotes a unique set of physical specifications, including impedance, thickness, and usage."}, {"section": "Coaxial Cable", "q": "What are the three types of BNC connectors for coaxial cable?", "opts": ["RJ45, RJ11, and RJ23", "SC, ST, and MT-RJ", "BNC connector (for end connections), BNC T connector (for branching), and BNC terminator (to prevent signal reflection)", "UTP, STP, and FTP connectors"], "ans": 2, "exp": "The three popular BNC connector types are: the BNC connector (connects the end of the cable to a device), the BNC T connector (branches out to a computer), and the BNC terminator (used at the end of the cable to prevent signal reflection)."}, {"section": "Coaxial Cable", "q": "Compared to twisted-pair, what is a key performance characteristic of coaxial cable?", "opts": ["Coaxial cable has lower bandwidth than twisted-pair", "Coaxial cable has much higher bandwidth but also much higher attenuation, requiring more frequent repeaters", "Coaxial cable has exactly the same attenuation as twisted-pair", "Coaxial cable requires no repeaters at all"], "ans": 1, "exp": "Coaxial cable has a much higher bandwidth than twisted-pair, but the attenuation is also much higher in coaxial cable. The signal weakens rapidly and requires frequent use of repeaters."}, {"section": "Fiber-Optic", "q": "What material is a fiber-optic cable made of, and how does it transmit signals?", "opts": ["Copper wire — transmits electric current", "Glass or plastic — transmits signals in the form of light", "Ceramic — transmits signals as heat", "Aluminum — transmits signals as radio waves"], "ans": 1, "exp": "A fiber-optic cable is made of glass or plastic and transmits signals in the form of light."}, {"section": "Fiber-Optic", "q": "How does a fiber-optic cable guide light through its core?", "opts": ["Through absorption of light by the core material", "Through reflection — a glass/plastic core is surrounded by less-dense cladding; light moving through the core reflects off the cladding instead of refracting into it", "Through magnetic fields generated in the cable", "Through electrical resistance changes in the material"], "ans": 1, "exp": "Optical fibers use reflection to guide light through a channel. A glass or plastic core is surrounded by cladding of less dense glass or plastic. The density difference causes light to reflect off the cladding instead of refracting into it."}, {"section": "Fiber-Optic", "q": "What are the two main propagation modes in fiber-optic cable?", "opts": ["Electric and magnetic mode", "Guided and unguided mode", "Multimode and single mode", "Analog and digital mode"], "ans": 2, "exp": "Current technology supports two modes for propagating light along optical channels: multimode (multiple beams travel through the core in different paths) and single mode (highly focused light in a very narrow core with almost no delay differences)."}, {"section": "Fiber-Optic", "q": "What is the difference between multimode step-index and multimode graded-index fiber?", "opts": ["There is no practical difference", "In step-index, the core density is constant (causing signal distortion at the interface); in graded-index, density is highest at the center and decreases toward the edges (reducing distortion)", "Step-index is faster; graded-index is cheaper", "Graded-index uses a larger core diameter than step-index"], "ans": 1, "exp": "In multimode step-index fiber, density of the core remains constant, causing an abrupt change at the interface that distorts the signal. In multimode graded-index fiber, density is highest at the center and decreases gradually to the edges, reducing distortion."}, {"section": "Fiber-Optic", "q": "What are the three types of connectors for fiber-optic cables?", "opts": ["BNC, T-connector, and terminator", "RJ45, RJ11, and RJ23", "SC (subscriber channel — cable TV), ST (straight-tip — networking devices), and MT-RJ (same size as RJ45)", "UTP, STP, and FTP"], "ans": 2, "exp": "The three types of fiber-optic connectors are: SC (subscriber channel) used for cable TV, ST (straight-tip) used for connecting cable to networking devices, and MT-RJ which is the same size as RJ45."}, {"section": "Fiber-Optic", "q": "What is a key advantage of fiber-optic cable over twisted-pair and coaxial regarding repeaters?", "opts": ["Fiber-optic requires more repeaters than twisted-pair", "Fiber-optic requires the same number of repeaters as coaxial", "Fiber-optic requires about 1/10 as many repeaters as twisted-pair or coaxial cable", "Fiber-optic requires no repeaters ever"], "ans": 2, "exp": "The performance of fiber-optic cable is such that we need fewer (actually 1/10 as many) repeaters when we use fiber-optic cable compared to twisted-pair or coaxial cable. Its attenuation is much flatter."}, {"section": "Fiber-Optic", "q": "What is the outer jacket of a typical fiber-optic cable made of, and what do the Kevlar strands inside provide?", "opts": ["The jacket is rubber; Kevlar provides electrical insulation", "The jacket is PVC or Teflon; Kevlar strands provide strength (Kevlar is used in bulletproof vests)", "The jacket is copper; Kevlar provides the conducting path", "The jacket is glass; Kevlar provides heat resistance"], "ans": 1, "exp": "The outer jacket of a typical fiber-optic cable is made of either PVC or Teflon. Inside the jacket are Kevlar strands that strengthen the cable — Kevlar is a strong material used in bulletproof vests."}, {"section": "Unguided Media", "q": "What is unguided media communication?", "opts": ["Communication using underground cables", "Media that transports electromagnetic waves without using a physical conductor — commonly called wireless communication", "Communication limited to short distances only", "Media that uses light pulses in free air"], "ans": 1, "exp": "Unguided medium transports waves without using a physical conductor. This type of communication is often referred to as wireless communication. Signals are broadcast through free space and are available to anyone with a capable receiving device."}, {"section": "Unguided Media", "q": "What are the three propagation methods for unguided signals?", "opts": ["Wired, wireless, and optical", "Unicast, multicast, and broadcast", "Ground propagation, sky propagation, and line-of-sight propagation", "AM, FM, and digital propagation"], "ans": 2, "exp": "Unguided signals can travel via: ground propagation (low-frequency waves follow the curvature of the earth), sky propagation (higher frequencies bounce off the ionosphere for longer distances), and line-of-sight propagation (very high-frequency signals travel in straight lines between aligned antennas)."}, {"section": "Unguided Media", "q": "What is sky propagation and what advantage does it offer?", "opts": ["Signals travel along the surface of the earth", "Signals travel in straight lines from antenna to antenna", "Higher-frequency radio waves radiate upward into the ionosphere where they are reflected back to earth — allowing greater distances with lower output power", "Signals travel underground via buried cables"], "ans": 2, "exp": "In sky propagation, higher-frequency radio waves radiate upward into the ionosphere (a layer where particles exist as ions) where they are reflected back to earth. This allows for greater distances with lower output power."}, {"section": "Unguided Media", "q": "What is the frequency range for radio waves?", "opts": ["3 kHz to 1 GHz", "1 GHz to 300 GHz", "300 GHz to 400 THz", "Above 400 THz"], "ans": 0, "exp": "Electromagnetic waves ranging in frequencies between 3 kHz and 1 GHz are normally called radio waves. Waves from 1 to 300 GHz are called microwaves."}, {"section": "Unguided Media", "q": "What type of antenna do radio waves use, and what is its practical advantage?", "opts": ["Directional antennas — they focus signals precisely", "Parabolic dish antennas — they gather wide signals", "Omnidirectional antennas — they send signals in all directions, making them useful for multicasting (one sender, many receivers)", "Horn antennas — they transmit in a narrow beam"], "ans": 2, "exp": "Radio waves use omnidirectional antennas that send signals in all directions. The omnidirectional characteristic makes them useful for multicasting — one sender but many receivers — e.g., AM/FM radio, TV, cordless phones."}, {"section": "Unguided Media", "q": "What is the frequency range for microwaves, and what is their key directional characteristic?", "opts": ["3 kHz to 1 GHz; omnidirectional", "1 GHz to 300 GHz; unidirectional — sending and receiving antennas must be aligned", "300 GHz to 400 THz; can penetrate walls", "Above 400 THz; bidirectional"], "ans": 1, "exp": "Microwaves have frequencies between 1 and 300 GHz. They are unidirectional — when an antenna transmits microwaves, they can be narrowly focused, meaning the sending and receiving antennas need to be aligned."}, {"section": "Unguided Media", "q": "What are the two types of antennas used for microwave communications?", "opts": ["Omnidirectional and directional", "BNC and RJ45", "Parabolic dish (works as a funnel, catching wide waves and directing them to a focal point) and horn antenna", "Twisted and coaxial antennas"], "ans": 2, "exp": "Two types of antennas are used for microwave communications: the parabolic dish, which works as a funnel catching a wide range of waves and directing them to a common point; and the horn antenna."}, {"section": "Unguided Media", "q": "What is the frequency range of infrared waves, and what is their key limitation/advantage?", "opts": ["3 kHz to 1 GHz; can penetrate walls over long distances", "1 GHz to 300 GHz; best for satellite communication", "300 GHz to 400 THz; cannot penetrate walls — preventing interference between adjacent rooms", "Above 1 THz; used for cellular communications"], "ans": 2, "exp": "Infrared waves have frequencies from 300 GHz to 400 THz (wavelengths from 1 mm to 770 nm). They cannot penetrate walls — which prevents interference between one system and another in different rooms."}, {"section": "Guided Media", "q": "Optical fiber is a glass cable that accepts and transports signals in what form?", "opts": ["Electric current", "Magnetic fields", "Light", "Radio waves"], "ans": 2, "exp": "Unlike twisted-pair and coaxial cables that use metallic (copper) conductors for electric current, optical fiber is a glass cable that accepts and transports signals in the form of light."}];
const shuffled=[...questions].sort(()=>Math.random()-0.5);
let current=0,score=0,answered=false;
function render(){
  const body=document.getElementById('quiz-body'),total=shuffled.length;
  if(current>=total){
    const pct=Math.round((score/total)*100);
    const title=pct>=80?"Excellent work!":pct>=60?"Good effort!":"Keep studying!";
    const msg=pct>=80?"You have a strong grasp of this module.":pct>=60?"Review the topics you missed and try again.":"Go back over the slides and give it another shot.";
    const c=2*Math.PI*50,d=(pct/100)*c;
    const col=pct>=80?'#34d48a':pct>=60?'#f9a94b':'#f76f6f';
    document.getElementById('prog-fill').style.width='100%';
    document.getElementById('prog-label').textContent='Complete';
    document.getElementById('score-live').textContent='';
    body.innerHTML=`<div class="results"><div class="score-ring"><svg width="120" height="120" viewBox="0 0 120 120"><circle cx="60" cy="60" r="50" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="8"/><circle cx="60" cy="60" r="50" fill="none" stroke="${col}" stroke-width="8" stroke-dasharray="${d.toFixed(1)} ${c.toFixed(1)}" stroke-linecap="round"/></svg><div class="score-center"><div class="score-pct">${pct}%</div><div class="score-sub">${score}/${total}</div></div></div><div class="result-title">${title}</div><div class="result-msg">${msg}</div><div class="stats-grid"><div class="stat"><div class="stat-n green">${score}</div><div class="stat-l">Correct</div></div><div class="stat"><div class="stat-n red">${total-score}</div><div class="stat-l">Incorrect</div></div><div class="stat"><div class="stat-n acc">${total}</div><div class="stat-l">Total</div></div></div><button class="restart-btn" onclick="restart()">↺ Restart quiz</button></div>`;
    return;
  }
  const q=shuffled[current];
  document.getElementById('prog-fill').style.width=`${(current/shuffled.length)*100}%`;
  document.getElementById('prog-label').textContent=`${current+1} of ${total}`;
  document.getElementById('score-live').textContent=`Score: ${score}`;
  body.innerHTML=`<div class="q-card"><div class="section-badge">${q.section}</div><div class="q-text">${q.q}</div><div class="options" id="opts">${q.opts.map((o,i)=>`<button class="opt" id="opt${i}" onclick="pick(${i})"><span class="opt-letter">${['A','B','C','D'][i]}</span>${o}</button>`).join('')}</div><div class="feedback" id="fb"></div></div><div id="next-wrap"></div>`;
  answered=false;
}
function pick(i){
  if(answered)return;answered=true;
  const q=shuffled[current];
  document.querySelectorAll('.opt').forEach(b=>b.disabled=true);
  const fb=document.getElementById('fb');
  if(i===q.ans){document.getElementById('opt'+i).classList.add('correct');fb.className='feedback correct show';fb.innerHTML='<strong>Correct!</strong> '+q.exp;score++;}
  else{document.getElementById('opt'+i).classList.add('wrong');document.getElementById('opt'+q.ans).classList.add('revealed');fb.className='feedback wrong show';fb.innerHTML='<strong>Incorrect.</strong> '+q.exp;}
  document.getElementById('score-live').textContent=`Score: ${score}`;
  document.getElementById('next-wrap').innerHTML=`<button class="next-btn" onclick="next()">${current+1<shuffled.length?'Next question':'See results'} <span class="arrow">→</span></button>`;
}
function next(){current++;render();}
function restart(){current=0;score=0;render();}
render();
</script>
</body>
</html>
